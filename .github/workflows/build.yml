name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux build & tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-base-dev-tools libqt6svg6-dev qt6-charts-dev libqt6sql6-sqlite libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test (render main window offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen timeout 120 build/src/IndiaDevelopmentSimulator --screenshot screenshot-linux.png --months 3
          test -s screenshot-linux.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: screenshot-linux.png

  windows:
    name: Windows .exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts
          cache: true
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Package (windeployqt + data)
        shell: pwsh
        run: |
          $dist = "dist/IndiaDevelopmentSimulator"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/src/IndiaDevelopmentSimulator.exe $dist/
          Copy-Item -Recurse data $dist/data
          Copy-Item README.md, LICENSE-DATA.md $dist/ -ErrorAction SilentlyContinue
          Copy-Item docs/USER_GUIDE.md $dist/ -ErrorAction SilentlyContinue
          windeployqt --release --no-translations --compiler-runtime "$dist/IndiaDevelopmentSimulator.exe"
          # make sure the SQLite driver is present (scenario files)
          if (!(Test-Path "$dist/sqldrivers/qsqlite.dll")) { Write-Error "qsqlite.dll missing" }
      - name: Bundle llama.cpp server (CPU and Vulkan builds)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "dist/IndiaDevelopmentSimulator"
          # pick the newest llama.cpp build release (tags b####) that actually has Windows binaries
          $releases = gh api "repos/ggml-org/llama.cpp/releases?per_page=30" | ConvertFrom-Json
          $rel = $releases | Where-Object { -not $_.prerelease -and ($_.assets | Where-Object { $_.name -like "*bin-win-cpu-x64.zip" }) } | Select-Object -First 1
          if ($null -eq $rel) { Write-Error "No llama.cpp release with Windows binaries found"; exit 1 }
          Write-Host "llama.cpp release: $($rel.tag_name)"
          foreach ($pair in @(@("bin-win-cpu-x64.zip", "llama"), @("bin-win-vulkan-x64.zip", "llama-vulkan"))) {
            $a = $rel.assets | Where-Object { $_.name -like "*$($pair[0])" } | Select-Object -First 1
            if ($null -eq $a) { Write-Warning "asset $($pair[0]) not found in $($rel.tag_name)"; continue }
            gh release download $rel.tag_name --repo ggml-org/llama.cpp --pattern $a.name --dir llama-dl --clobber
            $tmp = "llama-x/$($pair[1])"
            Expand-Archive -Force "llama-dl/$($a.name)" $tmp
            # flatten: put the folder containing llama-server.exe at dist/<name>
            $exe = Get-ChildItem -Recurse -Filter llama-server.exe $tmp | Select-Object -First 1
            if ($null -eq $exe) { Write-Error "llama-server.exe missing in $($a.name)"; exit 1 }
            Copy-Item -Recurse -Force $exe.Directory.FullName "$dist/$($pair[1])"
          }
          if (!(Test-Path "$dist/llama/llama-server.exe")) { Write-Error "llama/llama-server.exe was not bundled"; exit 1 }
          "llama.cpp $($rel.tag_name) from https://github.com/ggml-org/llama.cpp (MIT licence). 'llama' = CPU build (used by default); 'llama-vulkan' = GPU build for NVIDIA/AMD/Intel GPUs: select its llama-server.exe in Settings > AI Providers > Local model." | Out-File "$dist/LLAMA_CPP.txt"
      - name: Smoke test (start the packaged exe offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/IndiaDevelopmentSimulator/IndiaDevelopmentSimulator.exe" -ArgumentList "--screenshot","$pwd/screenshot-windows.png","--months","3" -PassThru -Wait
          if (!(Test-Path screenshot-windows.png)) { Write-Error "The packaged application did not start correctly (exit code $($p.ExitCode))" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/IndiaDevelopmentSimulator -DestinationPath IndiaDevelopmentSimulator-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IndiaDevelopmentSimulator-windows-x64
          path: IndiaDevelopmentSimulator-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: screenshot-windows.png
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IndiaDevelopmentSimulator-windows-x64.zip
